# Bitty plugin manifest.
#
# File name, keys, and limits are the accepted v1 contract in bitty-docs
# `docs/specifications/plugin-platform-rfc.md` (OQ-012). The plugin manager and
# the host parse this file independently before any plugin code runs.
#
# `just manifest` validates this file with the authoritative `bitty-plugin-lint`
# from bitty-plugin-sdk (R-SDK-2), pinned by commit in `package.json` and
# `bun.lock`. Run `just install` once to materialize it.

[plugin]
id = "bitty-terminal.wheel"
name = "Wheel"
version = "0.0.1"
description = "Wheel — the official Agent Harness plugin for the Bitty terminal (mascot: Bittie the hamster). Pre-implementation scaffold."
# Optional SPDX expression. Add a LICENSE file and set this before publishing.
# license = "MIT"

[compat]
# Application and Plugin API ranges. Adjust to the host release you target;
# both are syntax-validated here and resolved by the host at install time.
# First-batch integration (wheel#39, CTX-0019): the bitty floor is pinned to
# the verified-against-current host 0.0.21, ceiling restrictive (<0.1)
# because 0.x minors may break (composer DEC-0001 pattern). Revisit on API bumps.
bitty = ">=0.0.21,<0.1"
plugin-api = "^1.0"

[capabilities]
# Deny by default: omit this table entirely when the plugin needs no authority.
# Request capabilities one by one; unknown identifiers fail validation and
# there is no allow-all identifier. `platform.notify` backs the example command
# in `lua/wheel/init.lua`.
platform.notify = true

[lazy]
# Static triggers let the host register the plugin without creating a VM.
# Commands are plugin-qualified: `<plugin-id>:<resource>`.
commands = [
  "bitty-terminal.wheel:hello",
  "bitty-terminal.wheel:status",
  "bitty-terminal.wheel:graph",
  "bitty-terminal.wheel:plan",
  "bitty-terminal.wheel:run",
  "bitty-terminal.wheel:trust",
  "bitty-terminal.wheel:team",
  "bitty-terminal.wheel:context",
  "bitty-terminal.wheel:tools",
  "bitty-terminal.wheel:orchestrate",
  "bitty-terminal.wheel:models",
  "bitty-terminal.wheel:branch",
  "bitty-terminal.wheel:checkpoint",
  "bitty-terminal.wheel:reflog",
]
